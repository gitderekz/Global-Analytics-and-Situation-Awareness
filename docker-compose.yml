version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gap-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: global_analytics_platform
      MYSQL_USER: analytics_user
      MYSQL_PASSWORD: analytics_pass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: gap-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: analytics_user
      DB_PASSWORD: analytics_pass
      DB_NAME: global_analytics_platform
      JWT_SECRET: ${JWT_SECRET:-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-refresh-in-production}
      CORS_ORIGIN: http://localhost:5173
      MAP_SERVER_URL: http://maptiler:3650
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: gap-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: gap-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
